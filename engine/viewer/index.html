<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine Preview</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --accent: #2563eb; --accent-soft: #dbeafe; --warn-bg: #fef3c7; --warn-text: #78350f; --unread: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a09; --panel: #1c1917; --text: #f5f5f4; --muted: #a8a29e; --line: #292524;
      --accent: #60a5fa; --accent-soft: #1e3a5f; --warn-bg: #422006; --warn-text: #fde68a; --unread: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; background: var(--warn-bg); color: var(--warn-text); }
  header strong { font-weight: 600; }
  #label { font-weight: 600; }
  header select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  #status { margin-left: auto; font-size: 12px; }
  main { display: grid; grid-template-columns: 220px minmax(280px, 1fr) minmax(320px, 1.4fr); height: calc(100vh - 46px); }
  nav, #list, #detail { overflow: auto; border-right: 1px solid var(--line); }
  nav { padding: 8px; background: var(--panel); }
  nav h3 { margin: 14px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .folder { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .folder:hover { background: var(--accent-soft); }
  .folder.active { background: var(--accent-soft); font-weight: 600; }
  .folder .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .listhead { position: sticky; top: 0; padding: 10px 14px; background: var(--bg); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .card { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .card:hover { background: var(--panel); }
  .card.active { background: var(--accent-soft); }
  .row { display: flex; gap: 8px; align-items: baseline; }
  .from { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .date { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--unread); flex: none; align-self: center; }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--line); color: var(--muted); }
  .more { display: block; width: calc(100% - 28px); margin: 12px 14px; padding: 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  #detail { padding: 14px 18px; }
  #detail h2 { margin: 0 0 12px; font-size: 18px; }
  .msg { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; background: var(--panel); }
  .msg .meta { padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; cursor: pointer; }
  .msg .where { font-size: 12px; color: var(--muted); }
  .msg .body { border-top: 1px solid var(--line); padding: 8px; }
  .msg iframe { width: 100%; height: 60vh; border: 0; background: #fff; border-radius: 4px; }
  .msg pre { white-space: pre-wrap; word-break: break-word; margin: 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .atts { padding: 8px 4px 2px; display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; }
  .atts a { color: var(--accent); }
  .note { color: var(--muted); font-size: 12px; padding: 4px 4px 0; }
  .empty { padding: 24px; color: var(--muted); }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; height: auto; }
    nav, #list, #detail { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
  }
</style>
</head>
<body>
<header>
  <strong>Read-only preview of the new engine</strong>
  <span>Nothing here can move, mark or change your mail.</span>
  <span id="label"></span>
  <select id="account" aria-label="Account"></select>
  <span id="status"></span>
</header>
<main>
  <nav id="folders" aria-label="Folders"></nav>
  <section id="list" aria-label="Conversations"><div class="empty">Choose a folder.</div></section>
  <section id="detail" aria-label="Conversation"><div class="empty">Choose a conversation.</div></section>
</main>
<script src="viewer.js"></script>
</body>
</html>
