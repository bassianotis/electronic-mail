# Test Dovecot shaped like a typical shared host's mail server:
# Dovecot 2.3, maildir, "INBOX." prefix with "." separator, no SPECIAL-USE advertised,
# CONDSTORE/QRESYNC/MOVE/UIDPLUS/IDLE/PREVIEW available. Any user logs in with password "pass".
mail_home = /srv/mail/%Lu
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000
protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

passdb {
  driver = static
  args = password=pass
}

namespace inbox {
  inbox = yes
  prefix = INBOX.
  separator = .
}

# Fake "now" is not possible; tests control state via APPEND/STORE/MOVE only.
mail_max_userip_connections = 10

log_path = /dev/stdout
info_log_path = /dev/stdout
